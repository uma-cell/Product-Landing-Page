<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Watches Grid with Cart</title>
  <style>
    :root{
      --bg:#f0f9ff;
      --box-bg:#e6f6ff;
      --card:#ffffff;
      --accent:#2ab57d;
      --muted:#6b7280;
      --gap:16px;
    }

    body {
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans", Arial;
      background: var(--bg); color: #111827; padding: 20px; position: relative;
      overflow-x: hidden;
    }

    .back-btn {
      position: fixed; top: 16px; left: 16px;
      background: white; border: none; border-radius: 50%;
      width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
      font-size: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 110;
    }
    .back-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .container {
      max-width:1100px; margin: 60px auto 0 auto;
    }

    h1 {
      font-size: 20px; margin: 0 0 8px 0; text-align: center;
    }

    /* Wrapper for search bar and cart button */
    .search-cart-wrapper {
      display: flex;
      align-items: center;
      max-width: 420px;
      margin: 10px auto 20px auto;
      gap: 12px;
    }

    .search-bar {
      flex-grow: 1;
      background: var(--box-bg);
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(16, 24, 40, 0.1);
      margin: 0; /* Remove margin so it fits in flex nicely */
    }
    .search-bar input[type="search"] {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 14px;
      padding: 6px 8px;
      outline: none;
      color: #111827;
    }
    .search-bar input[type="search"]::placeholder {
      color: var(--muted);
    }

    .cart-toggle {
      background: var(--accent);
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      color: white;
      font-size: 22px;
      cursor: pointer;
      z-index: 120;
      position: static; /* Remove fixed */
      transition: background 0.3s ease;
    }
    .cart-toggle:hover {
      background: #238a5d;
    }

    .box {
      background: var(--box-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(16,24,40,0.06);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
      gap: var(--gap);
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(15,23,42,0.08);
      position: relative;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }

    .img-wrap {
      position: relative;
      padding: 12px;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-wrap img {
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      border-radius: 8px;
    }

    .wish {
      position: absolute;
      right: 8px;
      top: 8px;
      background: rgba(255,255,255,0.9);
      border-radius: 999px;
      padding: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .card-body {
      padding: 10px 12px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    .brand {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title {
      font-size: 13px;
      color: var(--muted);
      flex-grow: 1;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
    }
    .price {
      font-weight: 700;
      font-size: 15px;
    }
    .old-price {
      font-size: 12px;
      color: var(--muted);
      text-decoration: line-through;
      margin-left: 8px;
    }
    .discount {
      background: rgba(42,181,125,0.12);
      color: var(--accent);
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
    }

    .add-cart-btn {
      margin-top: 8px;
      background: var(--accent);
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .add-cart-btn:hover {
      background: #238a5d;
    }

    .cart-panel {
      position: fixed;
      top: 0;
      right: -350px;
      width: 350px;
      height: 100%;
      background: white;
      box-shadow: -2px 0 8px rgba(0,0,0,0.1);
      transition: right 0.3s ease;
      z-index: 115;
      display: flex;
      flex-direction: column;
    }
    .cart-panel.open {
      right: 0;
    }
    .cart-header {
      padding: 16px;
      font-weight: 700;
      font-size: 18px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      color: var(--muted);
      font-weight: 700;
    }
    .cart-items {
      flex-grow: 1;
      overflow-y: auto;
      padding: 10px 16px;
    }
    .cart-item {
      display: flex;
      gap: 12px;
      margin-bottom: 15px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .cart-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }
    .cart-item-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .cart-item-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .cart-item-price {
      font-weight: 700;
      color: var(--accent);
    }
    .cart-item-qty {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qty-btn {
      border: none;
      background: var(--box-bg);
      width: 24px;
      height: 24px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 700;
      font-size: 16px;
      line-height: 1;
    }
    .remove-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      margin-top: 4px;
      align-self: flex-start;
      padding: 0;
    }

    .cart-footer {
      padding: 16px;
      border-top: 1px solid #eee;
      font-weight: 700;
      font-size: 16px;
      text-align: right;
    }

    @media (max-width:420px){
      body {padding: 12px;}
      .container {margin-top: 70px;}
      .cart-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <button class="back-btn" onclick="window.location.href='homepage.html'">←</button>

  <div class="container">
    <h1>✨ sarees Collection for Women ✨</h1>
    <div class="search-cart-wrapper">
      <div class="search-bar">
        <input type="search" id="searchInput" placeholder="sarees..." />
      </div>
      <button class="cart-toggle" id="cartToggle" title="Toggle Cart">🛒</button>
    </div>
    <div class="box">
      <div id="grid" class="grid"></div>
    </div>
  </div>

  <div class="cart-panel" id="cartPanel">
    <div class="cart-header">
      Cart <button class="cart-close" id="cartClose" title="Close Cart">×</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer" id="cartTotal">Total: ₹0</div>
  </div>

  <script>
    const products = [
  { brand: "Kanjivaram", title: "Traditional Silk Saree", price: 9999, oldPrice: 15000, discount: 30, rating: 4.7, reviews: "12k", img: "images/kanjivaram.jpg",page:"kanjivaram.html" },
  { brand: "Banarasi", title: "Banarasi pattu sarees with Handloom Saree", price: 15000, oldPrice: 25000, discount: 30, rating: 5.0, reviews: "8k", img: "images/banarasi.jpg",page:"banarasi.html" },
  { brand: "Chiffon", title: "Floral Printed Chiffon Saree", price: 1299, oldPrice: 1899, discount: 32, rating: 4.3, reviews: "6k", img: "images/chiffon.jpg",page:"chiffon.html" },
  { brand: "Georgette", title: "Embroidered Georgette Saree", price: 1799, oldPrice: 2499, discount: 28, rating: 4.2, reviews: "5.5k", img: "images/georgette.jpg",page:"georgette.html" },
  { brand: "Cotton", title: "Handloom Cotton Saree", price: 4499, oldPrice: 8850, discount: 29, rating: 4.1, reviews: "4k", img: "images/cotton.jpg",page:"cotton.html" },
  { brand: "Tussar Silk", title: "Tussar Silk Saree", price: 2199, oldPrice: 3299, discount: 33, rating: 4.4, reviews: "7k", img: "images/tussar.jpg",page:"tussar.html" },
  { brand: "Mysore Silk", title: "Pure Mysore Silk Saree", price: 2899, oldPrice: 4199, discount: 31, rating: 4.6, reviews: "9k", img: "images/mysore.jpg",page:"mysore.html" },
  { brand: "Bandhani", title: "Bandhani Print Saree", price: 5589, oldPrice: 7999, discount: 28, rating: 4.3, reviews: "5k", img: "images/bandhani.jpg",page:"bandhani.html" },
  { brand: "Paithani", title: "Paithani Silk Saree", price: 1979, oldPrice: 26000, discount: 31, rating: 4.7, reviews: "10k", img: "images/paithani.jpg",page:"paithani.html" },
  { brand: "Net Saree", title: "Designer Net Saree", price: 1999, oldPrice: 2999, discount: 33, rating: 4.5, reviews: "6.5k", img: "images/net.jpg",page:"net.html" },
];

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');
    const cartToggle = document.getElementById('cartToggle');
    const cartPanel = document.getElementById('cartPanel');
    const cartClose = document.getElementById('cartClose');
    const cartItemsContainer = document.getElementById('cartItems');
    const cartTotalDisplay = document.getElementById('cartTotal');

    let cart = {};

    function createCard(p, index){
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <div class="img-wrap">
          <img src="${p.img}" alt="${p.title}" />
          <div class="wish" title="Add to wishlist">💖</div>
        </div>
        <div class="card-body">
          <div class="brand">${p.brand}</div>
          <div class="title">${p.title}</div>
          <div class="rating">⭐ ${p.rating} · ${p.reviews} reviews</div>
          <div class="price-row">
            <div>
              <span class="price">₹${p.price}</span>
              <span class="old-price">₹${p.oldPrice}</span>
            </div>
            <div class="discount">↓${p.discount}%</div>
          </div>
          <button class="add-cart-btn" data-index="${index}">Add to Cart</button>
        </div>
      `;
div.addEventListener('click', (e) => {
        if(!e.target.classList.contains('add-cart-btn') && !e.target.classList.contains('wish')){
          window.location.href = p.page;
        }
      });

      return div;
    }

    function displayProducts(items) {
      grid.innerHTML = '';
      items.forEach((p, idx) => grid.appendChild(createCard(p, idx)));
      document.querySelectorAll('.add-cart-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = btn.getAttribute('data-index');
          addToCart(index);
        });
      });
    }

    function addToCart(index) {
      const product = products[index];
      if(cart[product.title]){
        cart[product.title].quantity +=1;
      } else {
        cart[product.title] = {...product, quantity: 1};
      }
      updateCartDisplay();
      openCart();
    }

    function removeFromCart(title) {
      delete cart[title];
      updateCartDisplay();
    }

    function changeQuantity(title, delta) {
      if(cart[title]){
        cart[title].quantity += delta;
        if(cart[title].quantity <= 0){
          removeFromCart(title);
        } else {
          updateCartDisplay();
        }
      }
    }

    function updateCartDisplay() {
      cartItemsContainer.innerHTML = '';
      let total = 0;
      Object.values(cart).forEach(item => {
        total += item.price * item.quantity;
        const cartItem = document.createElement('div');
        cartItem.className = 'cart-item';
        cartItem.innerHTML = `
          <img src="${item.img}" alt="${item.title}" />
          <div class="cart-item-info">
            <div class="cart-item-title">${item.brand} - ${item.title}</div>
            <div class="cart-item-price">₹${item.price * item.quantity}</div>
            <div class="cart-item-qty">
              <button class="qty-btn" data-title="${item.title}" data-action="decrease">-</button>
              <span>${item.quantity}</span>
              <button class="qty-btn" data-title="${item.title}" data-action="increase">+</button>
            </div>
            <button class="remove-btn" data-title="${item.title}">Remove</button>
          </div>
        `;
        cartItemsContainer.appendChild(cartItem);
      });
      cartTotalDisplay.textContent = `Total: ₹${total}`;
      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const title = btn.getAttribute('data-title');
          const action = btn.getAttribute('data-action');
          if(action === 'increase'){
            changeQuantity(title, 1);
          } else {
            changeQuantity(title, -1);
          }
        });
      });
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const title = btn.getAttribute('data-title');
          removeFromCart(title);
        });
      });
    }

    function openCart(){
      cartPanel.classList.add('open');
    }
    function closeCart(){
      cartPanel.classList.remove('open');
    }

    displayProducts(products);

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase().trim();
      const filtered = products.filter(p =>
        p.brand.toLowerCase().includes(query) ||
        p.title.toLowerCase().includes(query)
      );
      displayProducts(filtered);
    });

    cartToggle.addEventListener('click', () => {
      if(cartPanel.classList.contains('open')){
        closeCart();
      } else {
        openCart();
      }
    });

    cartClose.addEventListener('click', closeCart);

  </script>
</body>
</html>
